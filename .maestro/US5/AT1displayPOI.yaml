appId: host.exp.exponent
---
- runFlow:
    when:
      notVisible:
        id: "building-selection"
    file: ../openLink.yaml
- assertVisible:
    id: "campus-toggle-selector"
- tapOn: "SGW"
- tapOn: "POI filters"
- swipe:
    from:
      id: "radius-slider"
    direction: UP
- tapOn: "SGW"
- assertVisible:
    text: "MTLKFOOD"
- tapOn: "POI filters"
- swipe:
    from:
      id: "radius-slider"
    direction: RIGHT
- assertVisible:
    text: "Adonis Building"