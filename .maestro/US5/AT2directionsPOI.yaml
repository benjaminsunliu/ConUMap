appId: host.exp.exponent
---
- runFlow:
    when:
      notVisible:
        id: "building-selection"
    file: ../openLink.yaml
- setLocation:
    latitude: 45.4957849
    longitude: -73.577225
- assertVisible:
    id: "campus-toggle-selector"
- tapOn: "SGW"
- tapOn: "POI filters"
- swipe:
    from:
      id: "radius-slider"
    direction: UP
- tapOn: "SGW"
- tapOn:
    id: "marker-ChIJSRH2i2sayUwRYt5byUqY0Es"
- assertVisible:
    text: "MTLKFOOD"
- tapOn:
    id: "directions-action-button"
- swipe:
    start: 45%, 74%
    end: 45%, 40%
    duration: 800
- tapOn:
    id: "walking-route-0"
- assertVisible:
    id: "walking-step-0"
- swipe:
    from:
      id: "driving-selector"
    direction: DOWN
