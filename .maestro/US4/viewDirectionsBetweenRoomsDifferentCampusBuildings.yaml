appId: host.exp.exponent
---
- runFlow:
    when:
      notVisible:
        id: "building-selection"
    file: ../openLink.yaml
- assertVisible:
    id: "search-input"
- tapOn:
    id: "search-input"
- inputText: "H205"
- assertVisible: "H – H205"
- tapOn:
    text: "H – H205"
- assertVisible:
    id: "start-button"
- tapOn:
    id: "start-button"
- assertVisible:
    id: "destination-input"
- tapOn:
    id: "destination-input"
- inputText: "VL 212"
- assertVisible: "VL – VL 212"
- tapOn:
    text: "VL – VL 212"
- assertVisible:
    id: "walking-selector"
- swipe:
    from:
      id: "routes-info-popup"
    direction: UP
- tapOn:
    id: "walking-selector"
- assertVisible:
    id: "walking-route-0"
- tapOn:
    id: "walking-route-0"
- assertVisible:
    text: "navigate indoors from"
- tapOn:
    text: "navigate indoors from"
- assertVisible:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "back-arrow"
- swipe:
    from:
      id: "routes-info-popup"
    direction: DOWN
- tapOn:
    id: "walking-route-last"
- assertVisible:
    text: "Enter"
- tapOn:
    text: "Enter"
- assertVisible:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "next-step"
- tapOn:
    id: "back-arrow"
