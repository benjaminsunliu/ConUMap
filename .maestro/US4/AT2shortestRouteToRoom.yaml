appId: host.exp.exponent
---
- runFlow:
    when:
      notVisible:
        id: "building-selection"
    file: ../openLink.yaml
- tapOn: "Search building"
- inputText: "Vanier"
- tapOn:
    id: "end-result-VL"
- assertVisible:
    text: "Explore Rooms"
- tapOn: "Explore Rooms"
- tapOn: "Next Floor"
- assertVisible:
    text: "Floor 2"
- tapOn: "Start (VL820)"
- inputText: "VL 201.1"
- tapOn: "End (VL838)"
- inputText: "VL 201"
- assertVisible:
    id: "indoor-create-path-button"
- tapOn:
    id: "indoor-create-path-button"
- assertVisible:
    id: "active-outline-VL_201_1-VL_201"
- tapOn:
    id: "indoor-clear-end-room"
- tapOn: "End (VL838)"
- inputText: "VL 202.30"
- assertVisible:
    id: "indoor-create-path-button"
- tapOn:
    id: "indoor-create-path-button"
- assertVisible:
    id: "active-outline-VL_201_1-VL_201"
- tapOn: "Next Step"
- assertVisible:
    id: "active-outline-VL_201-VL_F2_hallway_waypoint_53"
- tapOn:
    id: "indoor-clear-start-room"
- tapOn: "Start (VL820)"
- inputText: "VL 203.3"
- assertVisible:
    id: "indoor-create-path-button"
- tapOn:
    id: "indoor-create-path-button"
- assertVisible:
    id: "active-outline-VL_203_3-VL_F2_hallway_waypoint_56"
